<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Kids - страница парка</title><link rel="stylesheet" href="style.css"></head><body data-nocta="1">
<main id="m"></main>
<script src="data.js"></script><script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const p=PARKS.find(x=>x.slug===new URLSearchParams(location.search).get('p'))||PARKS[0];
 localStorage.setItem('park',p.slug);chosen=p.slug;
 const multi=cityParks(p.citySlug).length>1,title=`My Kids - ${p.city}${multi?', '+p.name:''}`;
 document.title=title;
 const ph=(t,h=180)=>`<div class="ph" style="min-height:${h}px">${t}</div>`;
 const blk=(id,h,body,src)=>`<section class="blk" id="${id}"><div class="wrap"><h2>${h}</h2>${body}<p style="margin:16px 0 0"><span class="tag">данные: ${src}</span></p></div></section>`;
 const empty=!p.addr;
 m.innerHTML=`
 <section class="hero"><div class="wrap">
  <div class="crumbs" style="padding-top:0"><a href="index.html">Главная</a> / Парки / ${multi?`<a href="city.html?c=${p.citySlug}">${p.city}</a> / `:''}${p.name}</div>
  <p class="note">ПРОТОТИП шаблона парка. Блоки по порядку из docs/structure.md. Пустые блоки в живом сайте не показываются; здесь они приглушены для проверки порядка.${empty?' Для этого парка адрес, график, номер и цены ещё не получены.':''}</p>
  <h1>${title}</h1>
  <div class="facts"><div><b>Адрес</b>${p.addr?p.city+', '+p.addr:'уточняется'}</div><div><b>График</b>${p.hours||'уточняется'}</div></div>
  <button class="btn" onclick="book(PARKS.find(x=>x.slug==='${p.slug}'))">Забронировать</button>
  <a class="btn sec" href="#prices">Цены</a>
 </div></section>
 <div class="pbar"><div class="wrap"><a href="#about">О парке</a><a href="#photos">Фото</a><a href="#zones">Зоны</a><a href="#prices">Цены</a><a href="#bday">День рождения</a><a href="#shows">Шоу</a><a href="#games">Игры</a><a href="#animators">Аниматоры</a><a href="#masterclass">Мастер-классы</a><a href="#info">Практическая информация</a><a href="#faq">FAQ</a></div></div>
 ${blk('about','О парке',`<p>Описание парка. Текст вносит маркетинг в CMS.</p>`,'Парк')}
 ${blk('photos','Фотографии',`<div class="grid">${ph('фото')}${ph('фото')}${ph('фото')}</div>`,'Парк')}
 ${blk('zones','Игровые и активные зоны',`<div class="grid"><div class="card"><div class="ph" style="min-height:100px">фото</div><h3>Зона 1</h3><p>Короткое описание. Возраст: [от и до]</p><details><summary>Подробнее</summary><p>Полное описание зоны</p></details></div><div class="card"><div class="ph" style="min-height:100px">фото</div><h3>Зона 2</h3><p>Короткое описание. Возраст: [от и до]</p><details><summary>Подробнее</summary><p>Полное описание зоны</p></details></div></div>`,'Парк')}
 ${blk('prices','Цены этого парка',`${tariffTable(p)}${hasPrices(p)?`<h3>Акции и скидки</h3>${discountCards(p)}<p style="margin-top:12px"><a href="prices.html">Все цены и услуги</a></p>`:''}`,'Цена (этот парк)')}
 ${blk('bday','День рождения и пакеты',pkgCards(p,t=>`<button class="btn wa" onclick="bookPkg('${p.slug}','${t}')">Забронировать пакет</button>`)+(hasPrices(p)?`<h3>Дополнительные услуги</h3>${exCards(p,['Дополнительные услуги','Поздравления'])}`:''),'Пакет, Доп. услуга')}
 ${blk('shows','Шоу-программы',hasPrices(p)?exCards(p,['Шоу программы','Квесты','Активные игры','Дополнительные программы']):noData,'Программа')}
 ${blk('games','Игры',`<div class="grid"><div class="card"><h3>Игра 1</h3><p>Описание, возраст</p></div></div>`,'Игра')}
 ${blk('animators','Аниматоры',`<div class="grid"><div class="card">${ph('фото',120)}<h3>Имя аниматора</h3><p>Образ, возраст детей</p></div></div>`,'Аниматор')}
 ${blk('masterclass','Мастер-классы',hasPrices(p)?exCards(p,['Мастер-классы']):noData,'Программа')}
 ${blk('info','Практическая информация',`<p class="note">Важно знать: [носки или тапочки обязательны, бронь заранее]. Текст вносит маркетинг.</p><div class="grid">
<div class="card"><h3>График</h3><p>${p.hours||'уточняется'}<br>Праздничные дни: [график]<br><small>График может меняться, актуальное уточняйте в WhatsApp.</small></p></div>
<div class="card"><h3>Адрес и карта</h3><p>${p.addr?p.city+', '+p.addr:'уточняется'}<br>${p.map?`<a href="${p.map}" target="_blank">2ГИС</a> · <a href="${gmap(p)}" target="_blank">Google</a>`:''}</p></div>
<div class="card"><h3>Контакты</h3><p>${p.wa?fmtPhone(p.wa)+'<br>WhatsApp парка':'уточняется'}</p></div>
<div class="card"><h3>Правила посещения</h3><p>${(typeof INFO!=='undefined'&&INFO[p.slug]&&INFO[p.slug].rules)||'Текст'}</p></div><div class="card"><h3>Условия пребывания</h3><p>${(typeof INFO!=='undefined'&&INFO[p.slug]&&INFO[p.slug].stay)||'Текст'}</p></div><div class="card"><h3>Сопровождающие</h3><p>Текст</p></div>
<div class="card"><h3>Одежда, носки и тапочки</h3><p>${(typeof INFO!=='undefined'&&INFO[p.slug]&&INFO[p.slug].clothes)||'Текст'}</p></div><div class="card"><h3>Парковка</h3><p>Текст</p></div><div class="card"><h3>Торты</h3><p>Текст</p></div><div class="card"><h3>Другая важная информация</h3><p>Текст</p></div></div>${ph('карта 2ГИС / Google',220)}`,'Парк')}
 ${blk('faq','Вопросы и ответы',`<details><summary>Вопрос 1</summary><p>Ответ</p></details><details><summary>Вопрос 2</summary><p>Ответ</p></details>`,'Вопрос FAQ (все парки или этот)')}
 <section class="blk"><div class="wrap" style="text-align:center"><h2>Забронируйте посещение в ${title}</h2><button class="btn wa" onclick="book(PARKS.find(x=>x.slug==='${p.slug}'))">Написать в WhatsApp</button></div></section>`;
});
</script></body></html>
